<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Style Rules</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Simple Style Rules</h1>
        <p>
          Add lightweight CSS rules by domain. This is intentionally simpler than Stylus:
          just domain pattern, selector, and declarations.
        </p>
      </header>

      <section class="panel">
        <h2 id="form-title">Add Rule</h2>

        <form id="rule-form" novalidate>
          <label class="field">
            <span>Rule name (optional)</span>
            <input id="rule-name" name="name" type="text" placeholder="Scrollbar tweak" />
          </label>

          <label class="field">
            <span>Domain pattern</span>
            <input
              id="rule-domain"
              name="domainPattern"
              type="text"
              placeholder="*.example.com"
              required
            />
            <small>Use <code>*</code> for all sites, <code>example.com</code> for exact, or <code>*.example.com</code> for subdomains.</small>
          </label>

          <label class="field">
            <span>Selector</span>
            <input
              id="rule-selector"
              name="selector"
              type="text"
              placeholder="html, body"
              required
            />
          </label>

          <label class="field">
            <span>CSS declarations</span>
            <textarea
              id="rule-declarations"
              name="declarations"
              rows="6"
              placeholder="scrollbar-width: auto !important;\nscrollbar-color: rgba(128, 128, 128, 0.8) #F1F1F1 !important;"
              required
            ></textarea>
          </label>

          <label class="checkbox-row">
            <input id="rule-enabled" name="enabled" type="checkbox" checked />
            <span>Enabled</span>
          </label>

          <div class="button-row">
            <button type="submit" id="save-button">Save Rule</button>
            <button type="button" id="cancel-edit" class="secondary" hidden>Cancel Edit</button>
          </div>

          <p id="status-message" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel">
        <h2>Saved Rules</h2>
        <p id="empty-state" class="empty-state">No custom rules saved yet.</p>
        <div id="rules-list" class="rules-list"></div>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
